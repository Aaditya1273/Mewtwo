[package]
name = "presence"
version = "0.1.0"
description = "PRESENCE: durable profile + daily attestation anchors written by the ATTEST engine"
edition.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "presence"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { version = "1.2.1", features = ["init-if-needed"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
